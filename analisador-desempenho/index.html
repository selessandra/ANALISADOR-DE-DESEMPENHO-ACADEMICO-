<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analisador de Desempenho Acadêmico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Analisador de Desempenho Acadêmico</h1>
<p class="sub">Aprovado: média ≥ 7 · Recuperação: de 5 a menos de 7 · Reprovado: &lt; 5</p>

<section class="card">
  <h2>Registrar aluno</h2>
  <p class="sub" style="margin:0 0 10px">De 1 a 4 notas (0 a 10). Pode usar vírgula ou ponto: 5,5 ou 5.5</p>
  <div class="row">
    <input id="nome" placeholder="Nome do aluno">
    <input class="nota" inputmode="decimal" placeholder="Nota 1">
    <input class="nota" inputmode="decimal" placeholder="Nota 2">
    <input class="nota" inputmode="decimal" placeholder="Nota 3">
    <input class="nota" inputmode="decimal" placeholder="Nota 4">
    <button id="add">Adicionar</button>
    <button id="demo" class="sec">Carregar exemplo</button>
  </div>
  <p class="err" id="err"></p>
</section>

<section class="card">
  <h2>Resumo da turma</h2>
  <div class="stats" id="stats"></div>
</section>

<section class="card">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0">Alunos</h2>
    <div class="row">
      <select id="filtro">
        <option>Todos</option><option>Aprovado</option><option>Recuperação</option><option>Reprovado</option>
      </select>
      <button id="limpar" class="sec">Limpar turma</button>
    </div>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>Nome</th><th>Notas</th><th>Média</th><th>Situação</th><th></th></tr></thead>
    <tbody id="corpo"></tbody>
  </table></div>
</section>

<section class="card">
  <h2>Relatório de desempenho</h2>
  <button id="gerar">Gerar relatório</button>
  <button id="baixar" class="sec">Baixar PDF</button>
  <pre id="relatorio" hidden></pre>
</section>
</main>

<script src="js/utils.js"></script>
<script src="js/regras.js"></script>
<script src="js/notas.js"></script>
<script src="js/alunos.js"></script>
<script src="js/analise.js"></script>
<script src="js/filtro.js"></script>
<script src="js/estatisticas.js"></script>
<script src="js/formatacao.js"></script>
<script src="js/relatorio.js"></script>
<script src="js/pdf.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
